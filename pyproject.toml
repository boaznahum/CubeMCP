[project]
name = "cubemcp"
version = "0.1.0"
description = "MCP server for CubeSolve — gives Claude Code the ability to build, test, run, and solve Rubik's cubes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Boaz Nahum" },
]
keywords = ["mcp", "rubiks-cube", "claude", "cubesolve"]

dependencies = [
    "mcp[cli]>=1.25,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
cubemcp = "cubemcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubemcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
